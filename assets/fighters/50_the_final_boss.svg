      <path d="M312 106 C371 100 421 65 453 15 C404 48 352 42 301 67Z" fill="url(#armor2)" stroke="#020307" stroke-width="10"/>
      <path d="M224 72 L205 14 L246 58 M260 59 L260 2 L278 61 M296 72 L317 14 L276 58" fill="#1a1a20" stroke="#020307" stroke-width="8"/>
