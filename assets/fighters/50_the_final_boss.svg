      <path d="M359 389 L450 125" stroke="#020307" stroke-width="34" stroke-linecap="round"/><path d="M359 389 L450 125" stroke="url(#armor2)" stroke-width="19" stroke-linecap="round"/><path d="M359 389 L450 125" stroke="#cc153a" stroke-width="5"/>
      <path d="M426 150 L484 73 L512 98 L472 174Z" fill="#1a0b11" stroke="#c81339" stroke-width="9"/>
      <path d="M432 150 L473 111" stroke="#efe9df" stroke-width="5"/>
