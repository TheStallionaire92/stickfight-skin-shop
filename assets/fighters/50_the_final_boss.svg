      <path d="M188 224 C127 176 69 165 22 205 C70 213 105 243 127 286 C84 274 50 289 26 326 C91 310 141 332 183 386 L216 308Z" fill="#0a080d" stroke="#020307" stroke-width="12"/>
      <path d="M332 224 C393 176 451 165 498 205 C450 213 415 243 393 286 C436 274 470 289 494 326 C429 310 379 332 337 386 L304 308Z" fill="#0a080d" stroke="#020307" stroke-width="12"/>
