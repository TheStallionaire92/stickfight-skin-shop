      <g fill="none" stroke="#d4153c" stroke-opacity=".48" stroke-width="4"><path d="M223 82 L245 94 L238 112"/><path d="M301 88 L282 101 L289 117"/><path d="M218 304 L239 315 L230 335"/><path d="M302 304 L281 315 L290 335"/></g>
    </g>
</svg>