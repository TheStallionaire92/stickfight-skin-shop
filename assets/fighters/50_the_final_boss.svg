      <circle cx="260" cy="285" r="33" fill="#050207" stroke="#d2143b" stroke-width="7"/>
      <circle cx="260" cy="285" r="17" fill="url(#core)" filter="url(#glow)"/>
      <path d="M260 253 L270 273 L294 285 L270 297 L260 320 L250 297 L226 285 L250 273Z" fill="#d2143b" opacity=".75"/>
