<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-label="Schattenhengst">
<defs>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ae77ff"/><stop offset=".2" stop-color="#3d185d"/>
      <stop offset=".54" stop-color="#252a33"/><stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="armor2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f5"/><stop offset=".18" stop-color="#ae77ff"/>
      <stop offset=".58" stop-color="#5a616d"/><stop offset="1" stop-color="#101319"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#3d185d"/><stop offset=".3" stop-color="#25151e"/>
      <stop offset=".68" stop-color="#0c0d12"/><stop offset="1" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#71504a"/><stop offset="1" stop-color="#3a2424"/>
    </linearGradient>
    <linearGradient id="horse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ae77ff"/><stop offset=".18" stop-color="#3d185d"/>
      <stop offset=".52" stop-color="#1a1c23"/><stop offset="1" stop-color="#020306"/>
    </linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#fff"/><stop offset=".18" stop-color="#ae77ff"/><stop offset=".48" stop-color="#3d185d"/><stop offset="1" stop-color="#6f2aa2" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-70%" y="-70%" width="240%" height="240%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity=".8"/></filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

    <ellipse cx="315" cy="494" rx="218" ry="17" fill="#000" opacity=".42"/>
