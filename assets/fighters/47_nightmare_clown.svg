      <path d="M206 340 L194 478" stroke="#ede8e0" stroke-width="28" stroke-linecap="round"/><path d="M264 340 L276 478" stroke="#4a0b1b" stroke-width="28" stroke-linecap="round"/>
      <path d="M171 476 H216 L211 503 H159Z M254 476 H299 L312 503 H260Z" fill="#0a0a0c" stroke="#a61534" stroke-width="6"/>
