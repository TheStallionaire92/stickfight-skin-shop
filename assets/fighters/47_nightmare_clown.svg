      <path d="M317 356 L390 171" stroke="#020307" stroke-width="24"/><path d="M317 356 L390 171" stroke="#5f5958" stroke-width="10"/>
      <path d="M373 188 L433 118 L459 140 L422 220 L392 230Z" fill="url(#armor2)" stroke="#020307" stroke-width="8"/>
      <path d="M389 182 L433 142" stroke="#c81d3e" stroke-width="5"/>
