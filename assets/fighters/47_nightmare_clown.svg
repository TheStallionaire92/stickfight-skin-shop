      <path d="M184 244 C148 271 143 320 156 366" stroke="#dfd9d2" stroke-width="20" stroke-linecap="round"/><path d="M286 244 C321 271 327 311 317 356" stroke="#dfd9d2" stroke-width="20" stroke-linecap="round"/>
      <circle cx="156" cy="367" r="12" fill="#e2ddd6" stroke="#020307" stroke-width="5"/><circle cx="317" cy="357" r="12" fill="#e2ddd6" stroke="#020307" stroke-width="5"/>
      <!-- horror clown head, no horns -->
      <ellipse cx="235" cy="138" rx="48" ry="53" fill="#e6e0d9" stroke="#020307" stroke-width="9"/>
      <path d="M190 128 Q235 92 280 128 L273 154 Q235 170 197 154Z" fill="#f0ebe4"/>
      <ellipse cx="213" cy="134" rx="9" ry="13" fill="#090307"/><ellipse cx="257" cy="134" rx="9" ry="13" fill="#090307"/>
      <circle cx="213" cy="134" r="4" fill="#ff173d" filter="url(#glow)"/><circle cx="257" cy="134" r="4" fill="#ff173d" filter="url(#glow)"/>
      <circle cx="235" cy="151" r="9" fill="#c51735" stroke="#6a081a" stroke-width="3"/>
      <path d="M199 169 Q235 205 271 169 Q258 214 235 217 Q212 214 199 169Z" fill="#070307" stroke="#5d0a1c" stroke-width="5"/>
      <g fill="#f7f3ec"><path d="M207 176 L216 194 L224 178Z"/><path d="M224 179 L233 198 L241 179Z"/><path d="M242 179 L251 194 L260 176Z"/></g>
