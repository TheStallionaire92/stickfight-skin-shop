      <path d="M196 114 C176 96 173 72 189 55 C193 78 207 87 220 91 M274 114 C294 96 297 72 281 55 C277 78 263 87 250 91" fill="#8f1029" stroke="#020307" stroke-width="6"/>
      <path d="M205 98 L216 42 L271 48 L266 103Z" fill="#0a0a0d" stroke="#020307" stroke-width="8"/><path d="M202 95 H275" stroke="#a91435" stroke-width="6"/>
