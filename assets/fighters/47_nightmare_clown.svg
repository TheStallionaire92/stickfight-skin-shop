      <circle cx="194" cy="225" r="10" fill="#e6e0d8"/><circle cx="217" cy="216" r="10" fill="#e6e0d8"/><circle cx="240" cy="214" r="10" fill="#e6e0d8"/><circle cx="263" cy="217" r="10" fill="#e6e0d8"/><circle cx="286" cy="226" r="10" fill="#e6e0d8"/>
