    <path d="M214 278 L200 405 M346 278 L360 405 M207 316 H353 M220 278 H340" fill="none" stroke="url(#metal)" stroke-width="13" stroke-linecap="round"/>
    <path d="M220 279 Q280 257 340 279 L332 323 Q280 340 228 323Z" fill="#0a0c10" stroke="#050607" stroke-width="8"/>
    <path d="M228 309 Q280 326 332 309" fill="none" stroke="#8d1729" stroke-width="4" opacity=".7"/>
    <path d="M190 291 H226 M334 291 H370" stroke="#11151c" stroke-width="20" stroke-linecap="round"/><path d="M190 291 H226 M334 291 H370" stroke="#737d8c" stroke-width="9" stroke-linecap="round"/>

