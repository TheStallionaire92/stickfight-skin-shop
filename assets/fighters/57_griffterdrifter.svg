      <circle cx="382" cy="390" r="78" fill="none" stroke="#ff9220" stroke-width="12" filter="url(#glow)"/>
      <circle cx="382" cy="390" r="63" fill="none" stroke="#333946" stroke-width="8"/>
      <g stroke="#8993a1" stroke-width="4" opacity=".75"><path d="M382 327V453"/><path d="M319 390H445"/><path d="M338 346L426 434"/><path d="M426 346L338 434"/></g>
      <circle cx="382" cy="390" r="15" fill="url(#gold)" stroke="#030406" stroke-width="6"/>
      <path d="M354 391 Q382 352 412 389 Q385 378 383 416 Q376 381 354 391Z" fill="#ff9e21" stroke="#05070a" stroke-width="6"/>
