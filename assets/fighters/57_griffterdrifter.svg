  </g>

  <!-- restrained electric accents -->
  <g fill="none" stroke="#45baff" stroke-width="4" opacity=".72" filter="url(#glow)">
    <path d="M115 282 L104 267 L117 251 L107 235"/><path d="M405 333 L420 320 L414 304 L431 289"/>
  </g>
</svg>
