<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-label="GriffterDrifter Legendary StickFight character">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6edf5"/><stop offset=".18" stop-color="#737d8c"/><stop offset=".52" stop-color="#202733"/><stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a0"/><stop offset=".22" stop-color="#ffca45"/><stop offset=".62" stop-color="#d87813"/><stop offset="1" stop-color="#642900"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d0e18"/><stop offset=".4" stop-color="#1c0b11"/><stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b075"/><stop offset=".55" stop-color="#b86539"/><stop offset="1" stop-color="#71351f"/>
    </linearGradient>
    <radialGradient id="wheelGlow"><stop offset="0" stop-color="#ffefad"/><stop offset=".2" stop-color="#ffb72f"/><stop offset=".55" stop-color="#ff6c00"/><stop offset="1" stop-color="#ff6c00" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <ellipse cx="280" cy="495" rx="190" ry="17" fill="#000" opacity=".5"/>
  <ellipse cx="280" cy="400" rx="210" ry="105" fill="#ff7800" opacity=".08" filter="url(#soft)"/>

  <g filter="url(#shadow)">
