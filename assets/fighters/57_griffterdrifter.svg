    <path d="M223 407 L218 454 M337 407 L342 454" stroke="#202733" stroke-width="10"/>
    <circle cx="218" cy="465" r="26" fill="#080b10" stroke="#727d8b" stroke-width="7"/><circle cx="218" cy="465" r="12" fill="#ff8a12"/>
    <circle cx="342" cy="465" r="26" fill="#080b10" stroke="#727d8b" stroke-width="7"/><circle cx="342" cy="465" r="12" fill="#ff8a12"/>

    <!-- legs and plaid trousers, clearly separate anatomy -->
    <path d="M241 317 Q230 352 230 388 L264 395 L279 331Z" fill="#45131c" stroke="#050507" stroke-width="8"/>
    <path d="M319 317 Q330 352 330 388 L296 395 L281 331Z" fill="#45131c" stroke="#050507" stroke-width="8"/>
    <g stroke="#c74334" stroke-width="5" opacity=".8"><path d="M238 338L270 343 M234 360L263 366 M322 338L290 343 M326 360L297 366"/><path d="M250 322L244 386 M310 322L316 386"/></g>
    <path d="M223 381 Q244 376 264 389 L259 407 H220Z M337 381 Q316 376 296 389 L301 407 H340Z" fill="#171a20" stroke="#020307" stroke-width="7"/>

    <!-- torso, vest and arms -->
    <path d="M214 205 Q280 171 346 205 L333 318 Q280 340 227 318Z" fill="#1b1d23" stroke="#030406" stroke-width="11"/>
    <path d="M234 207 Q280 191 326 207 L317 301 Q280 316 243 301Z" fill="#ded8c9" stroke="#15171d" stroke-width="6"/>
    <path d="M221 206 L255 198 L263 310 L229 316Z M339 206 L305 198 L297 310 L331 316Z" fill="#111318" stroke="#050608" stroke-width="6"/>
    <path d="M235 220 L249 230 M325 220 L311 230" stroke="#ff9b16" stroke-width="4" opacity=".7"/>
    <path d="M227 229 Q183 244 158 293" fill="none" stroke="#050608" stroke-width="31" stroke-linecap="round"/><path d="M227 229 Q183 244 158 293" fill="none" stroke="url(#skin)" stroke-width="20" stroke-linecap="round"/>
    <path d="M333 229 Q374 244 395 287" fill="none" stroke="#050608" stroke-width="31" stroke-linecap="round"/><path d="M333 229 Q374 244 395 287" fill="none" stroke="url(#skin)" stroke-width="20" stroke-linecap="round"/>
    <path d="M143 285 Q160 272 176 291 L163 314 Q143 310 135 297Z" fill="#101217" stroke="#030406" stroke-width="7"/>
    <path d="M384 280 Q401 269 416 288 L408 310 Q388 313 378 296Z" fill="#101217" stroke="#030406" stroke-width="7"/>

    <!-- head, hair, beard -->
    <circle cx="280" cy="145" r="48" fill="url(#skin)" stroke="#030406" stroke-width="11"/>
    <path d="M232 139 Q221 111 248 85 Q280 61 319 84 Q343 104 329 141 Q314 113 280 113 Q246 113 232 139Z" fill="#181a20" stroke="#030406" stroke-width="9"/>
    <path d="M236 105 Q280 73 331 103 L322 123 Q281 102 238 126Z" fill="#3a3f49" stroke="#050608" stroke-width="6"/>
    <path d="M238 154 Q252 194 280 208 Q308 194 322 154 Q314 212 280 232 Q246 212 238 154Z" fill="#ece9e1" stroke="#090a0d" stroke-width="7"/>
    <path d="M246 151 Q256 176 270 174 Q279 170 280 159 Q281 170 290 174 Q304 176 314 151 Q310 192 280 203 Q250 192 246 151Z" fill="#f6f3eb"/>
    <path d="M247 142 L271 136 L276 148 L253 151Z M313 142 L289 136 L284 148 L307 151Z" fill="#07090c" stroke="#020304" stroke-width="4"/>
    <path d="M253 145 L268 141" stroke="#ff3a28" stroke-width="5" filter="url(#glow)"/><path d="M307 145 L292 141" stroke="#ff3a28" stroke-width="5" filter="url(#glow)"/>
    <path d="M267 164 Q280 170 293 164" fill="none" stroke="#542112" stroke-width="5"/>

    <!-- pipe -->
    <path d="M302 178 Q327 180 330 197" fill="none" stroke="#4b2a15" stroke-width="8" stroke-linecap="round"/><ellipse cx="333" cy="202" rx="12" ry="10" fill="#5a3018" stroke="#120a05" stroke-width="5"/>

    <!-- cane weapon with horse head -->
    <path d="M150 292 L96 455" stroke="#070405" stroke-width="26" stroke-linecap="round"/>
    <path d="M150 292 L96 455" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
    <path d="M151 285 Q127 257 141 232 Q153 210 181 216 Q201 221 199 241 Q193 257 174 260 L160 275Z" fill="url(#gold)" stroke="#050306" stroke-width="8"/>
    <path d="M168 222 L184 205 L186 229Z" fill="#c76a0c" stroke="#050306" stroke-width="5"/>
    <path d="M181 235 Q193 239 187 246 Q178 251 169 245Z" fill="#080a0f"/>
    <circle cx="177" cy="232" r="5" fill="#3bc9ff" filter="url(#glow)"/>
    <path d="M92 452 L85 482" stroke="#f0c05b" stroke-width="9" stroke-linecap="round"/>

    <!-- horseshoe necklace -->
    <path d="M267 224 Q280 244 293 224 M267 224 V238 M293 224 V238" fill="none" stroke="#ffcb45" stroke-width="5"/>

    <!-- wheel spikes -->
    <g fill="url(#metal)" stroke="#030406" stroke-width="4">
      <path d="M93 355 L66 340 L96 376Z"/><path d="M92 425 L61 438 L101 407Z"/><path d="M467 355 L494 340 L464 376Z"/><path d="M468 425 L499 438 L459 407Z"/>
