    <path d="M363 138 L431 112 L442 298 L406 283 L393 318 L367 290Z" fill="#120b10" stroke="#020307" stroke-width="10"/>
    <path d="M376 158 Q402 132 425 154 L427 268 Q402 246 378 266Z" fill="#54131e" opacity=".72"/>
    <path d="M392 181 Q405 166 419 181 Q407 177 405 193 Q402 177 392 181Z" fill="#d9dce2" opacity=".75"/>

    <!-- wheelchair rear wheels -->
    <g>
      <circle cx="178" cy="390" r="91" fill="#05070a" stroke="#090b10" stroke-width="18"/>
      <circle cx="178" cy="390" r="78" fill="none" stroke="#ff9220" stroke-width="12" filter="url(#glow)"/>
      <circle cx="178" cy="390" r="63" fill="none" stroke="#333946" stroke-width="8"/>
      <g stroke="#8993a1" stroke-width="4" opacity=".75"><path d="M178 327V453"/><path d="M115 390H241"/><path d="M134 346L222 434"/><path d="M222 346L134 434"/></g>
      <circle cx="178" cy="390" r="15" fill="url(#gold)" stroke="#030406" stroke-width="6"/>
      <path d="M150 391 Q178 352 208 389 Q181 378 179 416 Q172 381 150 391Z" fill="#ff9e21" stroke="#05070a" stroke-width="6"/>
