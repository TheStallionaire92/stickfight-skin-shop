  <path d="M189 132 L202 130 M218 130 L231 132" stroke="#ff1f32" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M203 146 L210 153 L217 146" fill="none" stroke="#41454c" stroke-width="4"/>
  <path d="M194 160 H226" stroke="#3a3e45" stroke-width="5" stroke-dasharray="5 4"/>
  <!-- rib cage -->
  <path d="M187 197 Q210 181 233 197 L230 279 Q210 300 190 279Z" fill="#111317" stroke="#3c4147" stroke-width="5"/>
  <path d="M195 209 Q210 201 225 209 M193 226 Q210 216 227 226 M194 243 Q210 234 226 243 M198 260 Q210 251 222 260" fill="none" stroke="#8b9097" stroke-width="6" stroke-linecap="round"/>
  <path d="M210 198 V274" stroke="#777c83" stroke-width="6"/>
  <!-- bony shoulders and arms -->
  <circle cx="176" cy="208" r="11" fill="#777c83" stroke="#30343a" stroke-width="4"/>
  <circle cx="244" cy="208" r="11" fill="#777c83" stroke="#30343a" stroke-width="4"/>
  <path d="M174 215 Q145 244 147 291" stroke="#8b9097" stroke-width="12" stroke-linecap="round"/>
  <path d="M246 215 Q270 236 279 265" stroke="#8b9097" stroke-width="12" stroke-linecap="round"/>
  <!-- hands visibly gripping the scythe -->
  <circle cx="148" cy="295" r="11" fill="#858a91" stroke="#34383e" stroke-width="4"/>
  <circle cx="282" cy="275" r="11" fill="#858a91" stroke="#34383e" stroke-width="4"/>
  <!-- skeletal legs visible below open cloak -->
  <path d="M199 282 L184 419 L176 480" stroke="#7e838a" stroke-width="15" stroke-linecap="round"/>
  <path d="M221 282 L236 419 L244 480" stroke="#7e838a" stroke-width="15" stroke-linecap="round"/>
  <path d="M160 481 H190 M230 481 H260" stroke="#656a70" stroke-width="12"/>
