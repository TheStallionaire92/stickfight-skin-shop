  <path d="M146 301 L335 125" stroke="#252925" stroke-width="20" stroke-linecap="round"/>
  <path d="M146 301 L335 125" stroke="#656d66" stroke-width="9" stroke-linecap="round"/>
  <path d="M324 137 Q365 92 414 105 Q394 144 355 170 Q334 184 307 170 Q323 157 324 137Z" fill="#b7bdb9" stroke="#2f332f" stroke-width="7"/>
  <path d="M329 142 Q365 111 397 114" fill="none" stroke="#f0f4f1" stroke-width="4"/>
  <!-- thumb/finger bars around handle -->
  <path d="M141 291 L154 301 M274 266 L288 277" stroke="#b2b6bb" stroke-width="4"/>
  <!-- organic green soul flames -->
  <path d="M106 342 Q83 314 103 288 Q104 313 122 322 Q133 341 122 360 Q117 347 106 342Z" fill="#39ff72" opacity=".78" filter="url(#glow)"/>
  <path d="M314 385 Q292 357 309 333 Q313 357 327 367 Q337 385 327 403 Q321 390 314 385Z" fill="#39ff72" opacity=".68" filter="url(#glow)"/>
  <path d="M302 228 Q283 205 299 185 Q301 205 313 214 Q321 228 314 243 Q309 233 302 228Z" fill="#39ff72" opacity=".60" filter="url(#glow)"/>
</g>
</svg>