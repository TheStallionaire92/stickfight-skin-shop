<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-label="Kosmischer Schnitter"><defs>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f7f7"/><stop offset=".18" stop-color="#0b0c0e"/><stop offset=".58" stop-color="#292d34"/><stop offset="1" stop-color="#08090c"/></linearGradient>
<linearGradient id="cloth" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#0b0c0e"/><stop offset=".48" stop-color="#2d3137"/><stop offset="1" stop-color="#07080b"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#262933"/><stop offset=".55" stop-color="#0c0e13"/><stop offset="1" stop-color="#020306"/></linearGradient>
<filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000" flood-opacity=".7"/></filter>
<filter id="glow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<ellipse cx="210" cy="497" rx="118" ry="15" fill="#000" opacity=".46"/>
<!-- green spectral haze behind the reaper, shaped like smoke instead of rings -->
<path d="M102 401 C75 365 84 324 108 294 C87 257 100 211 138 183 C157 169 174 154 210 151 C246 154 263 169 282 183 C320 211 333 257 312 294 C336 324 345 365 318 401 C286 447 134 447 102 401Z" fill="#2dff6f" opacity=".10" filter="url(#soft)"/>
